name: Offline validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalog:
    name: Catalog and release contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Run offline project tests
        run: >-
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=tools python3 -m unittest
          discover -s tests -p 'test_*.py'
      - name: Validate immutable Catalog release
        run: >-
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=tools python3
          tools/release/check_catalog.py --release data/release/1

  flutter:
    name: Flutter contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Flutter 3.47.2
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true
      - name: Resolve locked packages
        run: flutter pub get --enforce-lockfile
      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Run static analysis
        run: flutter analyze --no-pub
      - name: Run Flutter tests
        run: flutter test --no-pub
