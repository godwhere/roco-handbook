name: Offline validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalog:
    name: Catalog and release contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Run offline project tests
        run: >-
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=tools python3 -m unittest
          discover -s tests -p 'test_*.py'
      - name: Validate immutable Catalog release
        run: >-
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=tools python3
          tools/release/check_catalog.py --release data/release/3

  ios:
    name: Native Swift and iOS contracts
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record Apple toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Run offline Swift tests
        run: swift test --package-path ios --scratch-path /tmp/roco-handbook-spm
      - name: Build native iOS simulator application
        run: >-
          xcodebuild -project ios/RocoHandbook.xcodeproj -scheme RocoHandbook
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath /tmp/roco-handbook-xcode CODE_SIGNING_ALLOWED=NO build
