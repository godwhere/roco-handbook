name: roco_handbook
description: "An independent offline Roco World reference handbook."
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.13.2

dependencies:
  archive: ^4.2.0
  crypto: ^3.0.7
  cryptography: ^2.9.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  path: ^1.9.1
  path_provider: ^2.1.6
  sqlite3: ^3.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/catalog/
    - assets/database/
    - assets/wiki/type-relations-v1.json
    - assets/wiki/game-descriptions-v1.json
    - assets/wiki/activity-timeline-v1.json
    - assets/wiki/fashion-catalog-v1.json
    - assets/wiki/tools/v1/activities/icons/
    - assets/wiki/tools/v1/fashions/cards/
    - assets/wiki/v2/pets/illustrations/
    - assets/wiki/v2/pets/shiny/
    - assets/wiki/v2/skills/
    - assets/wiki/v2/ui/info/
    - assets/wiki/v2/ui/navigation/
    - assets/wiki/v2/ui/skill-categories/
    - assets/wiki/v2/ui/sources/
    - assets/wiki/v2/ui/stats/
    - assets/wiki/v2/ui/types/
    - assets/fonts/v1/font-manifest.json
  fonts:
    - family: RocoDisplay
      fonts:
        - asset: assets/fonts/v1/roco-display.ttf
    - family: RocoNumbers
      fonts:
        - asset: assets/fonts/v1/roco-numbers.ttf
