name: roco_handbook
description: "An independent offline Roco World reference handbook."
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.13.2

dependencies:
  archive: ^4.2.0
  crypto: ^3.0.7
  cryptography: ^2.9.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  path: ^1.9.1
  path_provider: ^2.1.6
  sqlite3: ^3.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/catalog/
    - assets/database/
    - assets/wiki/type-relations-v1.json
    - assets/wiki/v1/pets/heads/
    - assets/wiki/v1/pets/illustrations/
    - assets/wiki/v1/skills/
    - assets/wiki/v1/ui/info/
    - assets/wiki/v1/ui/navigation/
    - assets/wiki/v1/ui/skill-categories/
    - assets/wiki/v1/ui/sources/
    - assets/wiki/v1/ui/stats/
    - assets/wiki/v1/ui/types/
