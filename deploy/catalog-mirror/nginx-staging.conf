# Keep this listener private until ICP approval and public TLS acceptance.
server {
    listen 127.0.0.1:8081;
    server_name time9.site;
    root /srv/roco-catalog/public;
    server_tokens off;
    autoindex off;
    disable_symlinks on;
    gzip off;
    max_ranges 1;
    client_max_body_size 1k;
    access_log off;
    add_header X-Content-Type-Options "nosniff" always;
    include /etc/nginx/snippets/roco-catalog-locations.conf;
}
