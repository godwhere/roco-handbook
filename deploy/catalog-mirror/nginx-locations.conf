# Shared by the private staging listener and the future public HTTPS listener.
if ($host != time9.site) {
    return 404;
}
if ($request_method !~ ^(GET|HEAD)$) {
    return 405;
}

location = /healthz {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    return 200 '{"service":"roco-catalog-mirror","status":"ready"}\n';
}

location = / {
    default_type text/plain;
    return 200 'Roco Handbook Catalog mirror.\n';
}

location = /roco/catalog-manifest.json {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
}

location ~ ^/roco/catalog-data-v[1-9][0-9]*/catalog-v[1-9][0-9]*\.zip$ {
    default_type application/octet-stream;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
}

location / {
    return 404;
}
